<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">Ethan Chen / 陈奕恺 — AI &amp; full-stack developer</title>
<desc id="desc">A luminous orbital core and connected circuits on a deep blue background. Building AI applications, web products, and desktop assistants.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071127"/><stop offset="1" stop-color="#111E40"/></linearGradient>
  <linearGradient id="orbit"><stop stop-color="#5CF7E2"/><stop offset=".5" stop-color="#92C5FF"/><stop offset="1" stop-color="#A39BFF"/></linearGradient>
  <linearGradient id="type" x2=".8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#A8C7EB"/></linearGradient>
  <linearGradient id="face" x2="1" y2="1"><stop stop-color="#5CF7E2" stop-opacity=".32"/><stop offset="1" stop-color="#A39BFF" stop-opacity=".06"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#465ECC" stop-opacity=".38"/><stop offset="1" stop-color="#465ECC" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="frame"><rect width="1280" height="520" rx="24"/></clipPath>
</defs>
<style>
  .orbit-flow{stroke-dasharray:90 850;animation:flow 18s linear infinite}
  .signal{stroke-dasharray:6 18;animation:flow 12s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-940}}
  @media (prefers-reduced-motion:reduce){.orbit-flow,.signal{animation:none}}
</style>
<g clip-path="url(#frame)">
