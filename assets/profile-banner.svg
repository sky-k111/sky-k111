    <circle r="187" stroke="#83B6E8" stroke-opacity=".15"/>
    <circle r="171" stroke="#83B6E8" stroke-opacity=".12" stroke-dasharray="2 12"/>
    <g stroke="url(#orbit)" stroke-opacity=".22">
      <ellipse rx="187" ry="70" transform="rotate(-28)"/>
      <ellipse rx="187" ry="70" transform="rotate(35)"/>
      <ellipse rx="187" ry="70" transform="rotate(94)"/>
      <ellipse rx="92" ry="182" transform="rotate(-28)"/>
      <ellipse rx="92" ry="182" transform="rotate(35)"/>
    </g>
