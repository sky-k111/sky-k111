    <ellipse class="orbit-flow" rx="187" ry="70" transform="rotate(-28)" stroke="#B8FFF4" stroke-width="3"/>
    <polygon points="0,-84 72,-42 72,42 0,84 -72,42 -72,-42" fill="url(#face)" stroke="url(#orbit)" stroke-width="2"/>
    <path d="M0 0L0 84M0 0L72 -42M0 0L-72 -42M0 -84V0M-72 42L0 0L72 42" stroke="#A3CBEF" stroke-opacity=".45"/>
