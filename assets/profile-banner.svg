    <text x="58" y="336" fill="url(#type)" font-size="130" font-weight="750" letter-spacing="-5">Chen.</text>
    <text x="68" y="389" fill="#B4C7E5" font-size="30" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">陈奕恺</text>
    <text x="68" y="443" fill="#E1EBFC" font-size="25">Build ideas into products.</text>
    <text x="806" y="477" fill="#9DAFD2" font-size="18">AI applications / Web / Desktop</text>
  </g>
  <path d="M66 475H358" stroke="#5CF7E2" stroke-opacity=".26"/>
